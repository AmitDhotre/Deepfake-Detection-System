<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', sans-serif">
  <title>Veritas Architecture</title>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4da3ff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="430" fill="#0b1121"/>

  <!-- React SPA -->
  <rect x="40" y="30" width="190" height="66" rx="10" fill="#111827" stroke="#4da3ff" stroke-width="1.5"/>
  <text x="135" y="58" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">React SPA</text>
  <text x="135" y="78" fill="#94a3b8" font-size="12" text-anchor="middle">(Vite)</text>

  <!-- FastAPI Backend -->
  <rect x="330" y="30" width="190" height="66" rx="10" fill="#111827" stroke="#4da3ff" stroke-width="1.5"/>
  <text x="425" y="58" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">FastAPI</text>
  <text x="425" y="78" fill="#94a3b8" font-size="12" text-anchor="middle">Backend</text>

  <!-- bidirectional arrow SPA <-> FastAPI -->
  <line x1="230" y1="53" x2="328" y2="53" stroke="#4da3ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="328" y1="75" x2="230" y2="75" stroke="#4da3ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="279" y="45" fill="#64748b" font-size="10.5" text-anchor="middle">HTTP / JSON</text>

  <!-- arrow FastAPI -> Auto-Selector -->
  <line x1="425" y1="96" x2="425" y2="140" stroke="#4da3ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Model Auto-Selector -->
  <rect x="295" y="142" width="260" height="62" rx="10" fill="#132038" stroke="#4da3ff" stroke-width="1.5"/>
  <text x="425" y="168" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">Model Auto-Selector</text>
  <text x="425" y="187" fill="#94a3b8" font-size="11.5" text-anchor="middle">Chooses strongest available model</text>

  <!-- branch lines -->
  <line x1="425" y1="204" x2="425" y2="228" stroke="#4da3ff" stroke-width="1.5"/>
  <line x1="150" y1="228" x2="700" y2="228" stroke="#4da3ff" stroke-width="1.5"/>
  <line x1="150" y1="228" x2="150" y2="264" stroke="#4da3ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="425" y1="228" x2="425" y2="264" stroke="#4da3ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="228" x2="700" y2="264" stroke="#4da3ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Tier 1: Heuristic -->
  <rect x="40" y="266" width="220" height="80" rx="10" fill="#111827" stroke="#4da3ff" stroke-width="1.5"/>
  <text x="150" y="294" fill="#e2e8f0" font-size="13.5" font-weight="600" text-anchor="middle">Heuristic Forensic</text>
  <text x="150" y="312" fill="#e2e8f0" font-size="13.5" font-weight="600" text-anchor="middle">Analyzer</text>
  <text x="150" y="332" fill="#64748b" font-size="11" text-anchor="middle">Always available</text>

  <!-- Tier 2: PyTorch CNN -->
  <rect x="315" y="266" width="220" height="80" rx="10" fill="#111827" stroke="#4da3ff" stroke-width="1.5"/>
  <text x="425" y="294" fill="#e2e8f0" font-size="13.5" font-weight="600" text-anchor="middle">PyTorch CNN</text>
  <text x="425" y="312" fill="#e2e8f0" font-size="13.5" font-weight="600" text-anchor="middle">(ResNet18)</text>
  <text x="425" y="332" fill="#64748b" font-size="11" text-anchor="middle">If trained .pt weights present</text>

  <!-- Tier 3: Keras Xception -->
  <rect x="590" y="266" width="270" height="80" rx="10" fill="#111827" stroke="#4da3ff" stroke-width="1.5"/>
  <text x="725" y="288" fill="#e2e8f0" font-size="13.5" font-weight="600" text-anchor="middle">Keras Xception /</text>
  <text x="725" y="306" fill="#e2e8f0" font-size="13.5" font-weight="600" text-anchor="middle">InceptionV3 + GRU</text>
  <text x="725" y="324" fill="#94a3b8" font-size="11" text-anchor="middle">(video temporal)</text>
  <text x="725" y="340" fill="#64748b" font-size="10.5" text-anchor="middle">If trained .h5 weights present</text>

  <!-- footer label -->
  <text x="450" y="405" fill="#334155" font-size="11" text-anchor="middle">Veritas — three-tier detection pipeline</text>
</svg>
